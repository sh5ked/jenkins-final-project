services:

  api:
    build:
      context: ./api
    expose:
      - "3000"
    networks:
      - final-network

  web:
    build:
      context: ./web
    ports:
      - "8085:3000"
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    networks:
      - final-network

networks:
  final-network:
    driver: bridge